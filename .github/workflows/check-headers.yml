name: Check license headers

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .cs headers
        run: |
          missing=0
          while IFS= read -r file; do
            if ! grep -q "This file is part of Looma" "$file"; then
              echo "Missing header: $file"
              missing=1
            fi
          done < <(find . -name "*.cs" -not -path "*/obj/*")
          exit $missing

      - name: Check .axaml headers
        run: |
          missing=0
          while IFS= read -r file; do
            if ! grep -q "This file is part of Looma" "$file"; then
              echo "Missing header: $file"
              missing=1
            fi
          done < <(find . -name "*.axaml" -not -path "*/obj/*")
          exit $missing